# Render Blueprint — Flyby MVP deployment.
#
# Replaces the AWS/Terraform CI/CD pipeline. Render auto-deploys this web
# service from the `main` branch of https://github.com/Company/Flyby on
# every push, so no AWS credentials or static secrets are required. The
# PostgreSQL connection string is injected automatically by Render from
# the database block below (see DATABASE_URL env var).
#
# Architecture decision context: https://github.com/Company/Flyby and TIR-179.
# Frontend (apps/web, Vite PWA) deploys separately as the `flyby-web` static
# site from the same repo (declared below); it is intentionally not bundled
# into the API service.
#
# Free tier notes:
#   - Web service: 750 instance-hours/month (covers a single instance 24/7).
#   - PostgreSQL: 1 GB storage, sufficient for MVP airport/checkpoint data.
# Redis is intentionally omitted for the MVP; SSE pub/sub uses an in-memory
# Map inside the API process. Add a `redis` database block later when we
# need cross-instance fan-out.

services:
  - type: web
    name: flyby-web
    runtime: static
    branch: main
    rootDir: apps/web
    # TIR-409: deploy on every push to this branch. Render's "Wait for CI"
    # trigger (`checksPass`) never matched this repo's CI check names, so
    # pushes were silently not deployed. CI still gates merges (checks run on
    # pull requests), so the commit trigger does not weaken the release gate.
    # `autoDeployTrigger` supersedes the deprecated `autoDeploy`.
    autoDeployTrigger: commit
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_BASE_URL
        value: https://flyby-api.onrender.com
    routes:
      - type: rewrite
        source: /*
        destination: /index.html

  - type: web
    name: flyby-api
    runtime: node
    plan: free
    region: oregon
    branch: main
    rootDir: apps/api
    # TIR-409: see flyby-web above.
    autoDeployTrigger: commit
    buildCommand: npm ci --omit=dev && npx prisma generate
    startCommand: npx prisma migrate deploy && npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: CORS_ORIGINS
        value: https://flyby-web.onrender.com
      - key: VAPID_PUBLIC_KEY
        sync: false
      - key: DATABASE_URL
        fromDatabase:
          name: flyby-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      # Guards the moderation review queue + hide/clear endpoints and the
      # admin DELETE /api/reports/:id path (TIR-325). Render auto-generates
      # the secret; the raw value never appears in the repo.
      - key: ADMIN_API_KEY
        generateValue: true

  # TIR-339 Option A: Monorepo staging services (branch: monorepo-candidate)
  # These are provisional staging services; data is isolated from production.
  - type: web
    name: flyby-web-staging
    runtime: static
    branch: monorepo-candidate
    rootDir: apps/web
    autoDeployTrigger: commit
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_BASE_URL
        value: https://flyby-api-staging.onrender.com
    routes:
      - type: rewrite
        source: /*
        destination: /index.html

  - type: web
    name: flyby-api-staging
    runtime: node
    plan: free
    region: oregon
    branch: monorepo-candidate
    rootDir: apps/api
    autoDeployTrigger: commit
    buildCommand: npm ci --omit=dev && npx prisma generate
    startCommand: npx prisma migrate deploy --schema prisma/deploy/schema.postgres.prisma && npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: staging
      - key: PORT
        value: 10000
      - key: CORS_ORIGINS
        value: https://flyby-web-staging.onrender.com
      - key: VAPID_PUBLIC_KEY
        sync: false
      - key: DATABASE_URL
        value: postgresql://flyby:flyby@db-staging:5432/flyby_staging
      - key: JWT_SECRET
        generateValue: true
      # Guards the moderation review queue + hide/clear endpoints and the
      # admin DELETE /api/reports/:id path (TIR-325). Render auto-generates
      # the secret; the raw value never appears in the repo.
      - key: ADMIN_API_KEY
        generateValue: true

databases:
  - name: flyby-db
    databaseName: flyby
    user: flyby
    plan: free
    postgresMajorVersion: "16"
    ipAllowList: []

  # TIR-339 Option A: Staging PostgreSQL (isolated from production)
  - name: flyby-db-staging
    databaseName: flyby_staging
    user: flyby_staging
    plan: free
    postgresMajorVersion: "16"
    ipAllowList: []
