# Render Blueprint — Flyby MVP deployment.
#
# Replaces the AWS/Terraform CI/CD pipeline. Render auto-deploys this web
# service from the `main` branch of https://github.com/Company/Flyby on
# every push, so no AWS credentials or static secrets are required. The
# PostgreSQL connection string is injected automatically by Render from
# the database block below (see DATABASE_URL env var).
#
# Architecture decision context: https://github.com/Company/Flyby and TIR-179.
# Frontend (apps/web, Vite PWA) deploys separately as the `flyby-web` static
# site from the same repo (declared below); it is intentionally not bundled
# into the API service.
#
# Free tier notes:
#   - Web service: 750 instance-hours/month (covers a single instance 24/7).
#   - PostgreSQL: 1 GB storage, sufficient for MVP airport/checkpoint data.
# Redis is intentionally omitted for the MVP; SSE pub/sub uses an in-memory
# Map inside the API process. Add a `redis` database block later when we
# need cross-instance fan-out.

services:
  - type: web
    name: flyby-web
    runtime: static
    branch: main
    rootDir: apps/web
    autoDeploy: true
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_BASE_URL
        value: https://flyby-api.onrender.com
    routes:
      - type: rewrite
        source: /*
        destination: /index.html

  - type: web
    name: flyby-api
    runtime: node
    plan: free
    region: oregon
    branch: main
    rootDir: apps/api
    autoDeploy: true
    buildCommand: npm ci --omit=dev && npx prisma generate
    startCommand: npx prisma migrate deploy && npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: DATABASE_URL
        fromDatabase:
          name: flyby-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true

databases:
  - name: flyby-db
    databaseName: flyby
    user: flyby
    plan: free
    postgresMajorVersion: "16"
    ipAllowList: []
