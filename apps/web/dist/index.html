<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="description" content="Flyby - Live airport security checkpoint wait times" />
    <title>Flyby - Checkpoint Wait Times</title>
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/logo192.png" />
    <style>
      * { box-sizing: border-box; margin: 0; padding: 0; }
      body { 
        font-family: system-ui, -apple-system, sans-serif; 
        background: #fff; 
        min-height: 100vh; 
        overflow-x: hidden; 
        padding: 1rem;
      }
      h1 { color: #333; font-size: 1.5rem; margin: 1rem 0; }
      .airport-list { margin: 1rem 0; }
      .airport-item { 
        background: #f8f9fa; 
        border: 1px solid #dee2e6; 
        border-radius: 8px; 
        padding: 1rem; 
        margin: 0.5rem 0; 
        display: flex; 
        justify-content: space-between; 
        align-items: center; 
        min-height: 44px; 
      }
      .airport-info { flex: 1; }
      .wait-minutes { 
        background: #e9ecef; 
        color: #495057; 
        padding: 0.25rem 0.5rem; 
        border-radius: 4px; 
        font-family: monospace; 
        min-width: 3rem; 
        text-align: center; 
      }
      .search-box { 
        margin: 1rem 0; 
        padding: 1rem; 
        background: #f8f9fa; 
        border: 1px solid #dee2e6; 
        border-radius: 8px; 
      }
      input { 
        width: 100%; 
        padding: 0.5rem; 
        font-size: 1rem; 
        border: 1px solid #ced4da; 
        border-radius: 4px; 
        margin-bottom: 0.5rem; 
      }
      button { 
        padding: 0.5rem 1rem; 
        background: #28a745; 
        color: white; 
        border: none; 
        border-radius: 4px; 
        cursor: pointer; 
        font-size: 1rem; 
      }
      button:hover { background: #218838; }
      .error { color: #dc3545; margin: 1rem 0; }
      .loading { color: #6c757d; }
      @media (max-width: 480px) { 
        .airport-item { padding: 0.75rem; min-height: auto; }
        .wait-minutes { font-size: 0.8rem; min-width: 2rem; }
      }
    </style>
  </head>
  <body>
    <div class="container">
      <h1>Flyby</h1>
      <p class="subtitle">Live airport checkpoint wait times</p>
      
      <div class="search-box">
        <input type="text" id="airportSearch" placeholder="Search airport code (JFK, LAX, etc.)" />
        <button onclick="loadAirport()">Go</button>
      </div>
      
      <div id="airportList" class="airport-list">
        <p class="loading">Select an airport to view wait times</p>
      </div>
      
      <div id="errorBox" class="error"></div>
    </div>
    
    <script>
      const airports = ["ATL", "LAX", "JFK", "ORD", "SFO", "DEN", "SEA", "MIA", "BOS"];
      
      function formatAirportCode(code) {
        return code.toUpperCase().trim();
      }
      
      async function loadAirport() {
        const input = document.getElementById('airportSearch');
        const code = formatAirportCode(input.value);
        const list = document.getElementById('airportList');
        const errorBox = document.getElementById('errorBox');
        
        errorBox.textContent = '';
        
        if (!code) {
          errorBox.textContent = 'Please enter an airport code';
          return;
        }
        
        list.innerHTML = 'Loading...';
        
        try {
          const resp = await fetch(`/api/wait-times?airport=${code}`);
          if (resp.status === 404) {
            list.innerHTML = `<p class="error">Airport not found: ${code}</p>`;
            return;
          }
          const data = await resp.json();
          
          if (!data.length) {
            list.innerHTML = `<p>No wait reports for ${code}</p>`;
            return;
          }
          
          list.innerHTML = data.map(r => `
            <div class="airport-item">
              <div class="airport-info">
                <strong>${code}</strong> - ${r.checkpoint || 'Main checkpoint'}
              </div>
              <div class="wait-minutes">${r.waitMinutes || 0} min</div>
            </div>
          `).join('');
        } catch (e) {
          list.innerHTML = `<p class="error">Error loading data</p>`;
        }
      }
      
      // Keyboard shortcut
      document.addEventListener('keypress', (e) => {
        if (e.key === 'Enter') loadAirport();
      });
      
      // Initial load - show airport list
      document.getElementById('airportList').innerHTML = `
        ${airports.map(code => `
          <div style="margin: 0.5rem 0; cursor: pointer;" onclick="loadAirport('${code}')">
            <strong>${code}</strong>
          </div>
        `).join('')}
      `;
    </script>
  </body>
</html>
