name: Flyby Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: flyby-deploy
  cancel-in-progress: false

jobs:
  deploy-api:
    name: Deploy Flyby API
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Deploy API to Render with 503 resilience
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          RENDER_API_SERVICE_ID: ${{ secrets.RENDER_API_SERVICE_ID }}
        run: |
          set -uo pipefail
          MAX_RETRIES=3
          DEPLOY_SUCCEEDED=0
          CONSECUTIVE_503=0

          for attempt in $(seq 1 $MAX_RETRIES); do
            set +e
            RESPONSE=$(curl -sS -X POST \
              -H "Authorization: Bearer $RENDER_API_KEY" \
              -H "Content-Type: application/json" \
              "https://api.render.com/v1/services/$RENDER_API_SERVICE_ID/deploy" 2>/dev/null)
            EXIT_CODE=$?
            set -e
            HTTP_CODE=""
            if [ "$EXIT_CODE" -eq 0 ]; then
              HTTP_CODE=$(echo "$RESPONSE" | head -c 3 || echo "")
            fi

            if [ -n "$HTTP_CODE" ] && [ "$HTTP_CODE" != "503" ]; then
              DEPLOY_SUCCEEDED=1
              echo "API deploy succeeded on attempt $attempt"
              CONSECUTIVE_503=0
              break
            fi

            if [ "$EXIT_CODE" -ne 0 ] || { [ -n "$HTTP_CODE" ] && [ "$HTTP_CODE" = "503" ]; }; then
              CONSECUTIVE_503=$((CONSECUTIVE_503 + 1))
              echo "API deploy attempt $attempt: 503 or error (consecutive 503s: $CONSECUTIVE_503)"

              if [ "$CONSECUTIVE_503" -ge 3 ]; then
                echo "CIRCUIT BREAKER: 3 consecutive 503s — pausing routine for 10 minutes"
                exit 1
              fi

              if [ "$attempt" -lt $MAX_RETRIES ]; then
                backoff=$((2 ** attempt))
                echo "Retrying API deploy in ${backoff}s..."
                sleep $backoff
              else
                echo "API deploy: 503 after $MAX_RETRIES retries — marking status unknown, continuing monitoring"
                DEPLOY_SUCCEEDED=0
                break
              fi
            fi
          done

          if [ "$DEPLOY_SUCCEEDED" -eq 0 ]; then
            echo "API deploy did not succeed after retries — treating as status unknown"
          fi

      - name: Wait for API deploy to complete with 503 resilience
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          RENDER_API_SERVICE_ID: ${{ secrets.RENDER_API_SERVICE_ID }}
        run: |
          set -uo pipefail
          TIMEOUT_SECONDS=600
          ELAPSED=0
          DEPLOY_READY=0

          while [ "$ELAPSED" -lt "$TIMEOUT_SECONDS" ] && [ "$DEPLOY_READY" -eq 0 ]; do
            STATUS=$(curl -sS -H "Authorization: Bearer $RENDER_API_KEY" \
              "https://api.render.com/v1/services/$RENDER_API_SERVICE_ID" 2>/dev/null | jq -r '.status // "unknown"' || echo "unknown")
            if [ "$STATUS" = "LIVE" ] || [ "$STATUS" = "STAGING" ]; then
              echo "API service is $STATUS"
              DEPLOY_READY=1
              exit 0
            fi
            if [ "$STATUS" = "503" ] || [ "$STATUS" = "unknown" ]; then
              echo "API status check got 503 or unknown, retrying in 10s..."
            else
              echo "API service status: $STATUS"
            fi
            ELAPSED=$((ELAPSED + 10))
            sleep 10
          done

          if [ "$DEPLOY_READY" -eq 0 ]; then
            echo "API deploy timed out after $TIMEOUT_SECONDS seconds — status unknown, continuing monitoring"
            exit 0
          fi

      - name: Set API env vars with 503 resilience
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          RENDER_API_SERVICE_ID: ${{ secrets.RENDER_API_SERVICE_ID }}
        run: |
          set -uo pipefail
          VARS=("DATABASE_URL" "VAPID_PUBLIC_KEY" "ADMIN_API_KEY")
          DB_URL="postgresql://flyby:flyby@db:5432/flyby"

          for var_name in "${VARS[@]}"; do
            local_val=""
            case "$var_name" in
              DATABASE_URL) local_val="$DB_URL" ;;
              VAPID_PUBLIC_KEY) local_val="${VAPID_PUBLIC_KEY}" ;;
              ADMIN_API_KEY) local_val="${ADMIN_API_KEY}" ;;
            esac

            success=0
            attempt=0
            while [ "$attempt" -lt 3 ] && [ "$success" -eq 0 ]; do
              attempt=$((attempt + 1))
              HTTP_CODE=$(curl -sS -o /dev/null -w '%{http_code}' \
                -X PUT \
                -H "Authorization: Bearer $RENDER_API_KEY" \
                -H "Content-Type: application/json" \
                -d "{\"key\":\"$var_name\",\"value\":\"$local_val\"}" \
                "https://api.render.com/v1/services/$RENDER_API_SERVICE_ID/env-vars" 2>/dev/null || echo "000")

              if [ "$HTTP_CODE" = "200" ]; then
                echo "$var_name set successfully"
                success=1
              else
                if [ "$HTTP_CODE" = "503" ]; then
                  echo "$var_name got 503, retrying in ${attempt}s (exponential backoff)..."
                  sleep $attempt
                else
                  echo "$var_name got HTTP $HTTP_CODE, retrying in ${attempt}s..."
                  sleep $attempt
                fi
              fi
            done

            if [ "$success" -eq 0 ]; then
              echo "$var_name: failed after 3 retries — status unknown, continuing"
            else
              echo "$var_name set"
            fi
          done

          echo "API env vars configuration complete"

  deploy-web:
    name: Deploy Flyby Web
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: deploy-api
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Deploy Web to Render with 503 resilience
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          RENDER_WEB_SERVICE_ID: ${{ secrets.RENDER_WEB_SERVICE_ID }}
        run: |
          set -uo pipefail
          MAX_RETRIES=3
          DEPLOY_SUCCEEDED=0
          CONSECUTIVE_503=0

          for attempt in $(seq 1 $MAX_RETRIES); do
            set +e
            RESPONSE=$(curl -sS -X POST \
              -H "Authorization: Bearer $RENDER_API_KEY" \
              -H "Content-Type: application/json" \
              "https://api.render.com/v1/services/$RENDER_WEB_SERVICE_ID/deploy" 2>/dev/null)
            EXIT_CODE=$?
            set -e
            HTTP_CODE=""
            if [ "$EXIT_CODE" -eq 0 ]; then
              HTTP_CODE=$(echo "$RESPONSE" | head -c 3 || echo "")
            fi

            if [ -n "$HTTP_CODE" ] && [ "$HTTP_CODE" != "503" ]; then
              DEPLOY_SUCCEEDED=1
              echo "Web deploy succeeded on attempt $attempt"
              CONSECUTIVE_503=0
              break
            fi

            if [ "$EXIT_CODE" -ne 0 ] || { [ -n "$HTTP_CODE" ] && [ "$HTTP_CODE" = "503" ]; }; then
              CONSECUTIVE_503=$((CONSECUTIVE_503 + 1))
              echo "Web deploy attempt $attempt: 503 or error (consecutive 503s: $CONSECUTIVE_503)"

              if [ "$CONSECUTIVE_503" -ge 3 ]; then
                echo "CIRCUIT BREAKER: 3 consecutive 503s — pausing routine for 10 minutes"
                exit 1
              fi

              if [ "$attempt" -lt $MAX_RETRIES ]; then
                backoff=$((2 ** attempt))
                echo "Retrying web deploy in ${backoff}s..."
                sleep $backoff
              else
                echo "Web deploy: 503 after $MAX_RETRIES retries — marking status unknown, continuing monitoring"
                DEPLOY_SUCCEEDED=0
                break
              fi
            fi
          done

          if [ "$DEPLOY_SUCCEEDED" -eq 0 ]; then
            echo "Web deploy did not succeed after retries — treating as status unknown"
          fi

      - name: Wait for Web deploy to complete with 503 resilience
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          RENDER_WEB_SERVICE_ID: ${{ secrets.RENDER_WEB_SERVICE_ID }}
        run: |
          set -uo pipefail
          TIMEOUT_SECONDS=600
          ELAPSED=0
          DEPLOY_READY=0

          while [ "$ELAPSED" -lt "$TIMEOUT_SECONDS" ] && [ "$DEPLOY_READY" -eq 0 ]; do
            STATUS=$(curl -sS -H "Authorization: Bearer $RENDER_API_KEY" \
              "https://api.render.com/v1/services/$RENDER_WEB_SERVICE_ID" 2>/dev/null | jq -r '.status // "unknown"' || echo "unknown")
            if [ "$STATUS" = "LIVE" ] || [ "$STATUS" = "STAGING" ]; then
              echo "Web service is $STATUS"
              DEPLOY_READY=1
              exit 0
            fi
            if [ "$STATUS" = "503" ] || [ "$STATUS" = "unknown" ]; then
              echo "Web status check got 503 or unknown, retrying in 10s..."
            else
              echo "Web service status: $STATUS"
            fi
            ELAPSED=$((ELAPSED + 10))
            sleep 10
          done

          if [ "$DEPLOY_READY" -eq 0 ]; then
            echo "Web deploy timed out after $TIMEOUT_SECONDS seconds — status unknown, continuing monitoring"
            exit 0
          fi

      - name: Verify web health
        run: |
          code=$(curl -sS -o /dev/null -w '%{http_code}' https://flyby-web.onrender.com/)
          if [ "$code" != "200" ]; then
            echo "Web health check failed with code $code"
            exit 1
          fi
          echo "Web health check passed"