name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  api-smoke-test:
    name: API smoke test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm ci --no-audit --no-fund || npm install --no-audit --no-fund

      - name: Syntax check
        run: node --check server.js

      - name: Run API tests
        run: npm test

      - name: Start API and verify health
        run: |
          node server.js &
          for i in $(seq 1 30); do
            if curl -sf http://127.0.0.1:3000/api/health -o /tmp/health.json; then
              cat /tmp/health.json
              grep -q '"status":"ok"' /tmp/health.json && exit 0
            fi
            sleep 1
          done
          echo "API did not become healthy in time"
          exit 1

      - name: Verify mock endpoints
        run: |
          # TIR-298: unknown airports must 404, never fabricate wait-time records
          code=$(curl -s -o /tmp/wt_unknown.json -w '%{http_code}' "http://127.0.0.1:3000/api/wait-times?airport=YYY")
          if [ "$code" != "404" ]; then
            echo "Expected 404 for unknown airport, got $code"
            cat /tmp/wt_unknown.json
            exit 1
          fi
          grep -q '"Airport not found"' /tmp/wt_unknown.json
          # Known airports still respond 200 (report data only, possibly empty)
          curl -sf "http://127.0.0.1:3000/api/wait-times?airport=SEA" -o /tmp/wt_sea.json
          curl -sf http://127.0.0.1:3000/api/notifications/vapid-public-key | grep -q '"publicKey"'
          # TIR-299: admin delete route must exist and be fail-closed. This boot
          # has no ADMIN_API_KEY, so DELETE must answer 503 (never 404 catch-all).
          code=$(curl -s -o /tmp/del_unauth.json -w '%{http_code}' -X DELETE "http://127.0.0.1:3000/api/reports/rpt_123")
          if [ "$code" != "503" ]; then
            echo "Expected 503 for DELETE without ADMIN_API_KEY, got $code"
            cat /tmp/del_unauth.json
            exit 1
          fi
          grep -q 'ADMIN_API_KEY' /tmp/del_unauth.json
          # TIR-300: forecast endpoints must exist and honor the contract.
          # This boot is in-memory mode (no DB): known airports answer 200 with
          # EMPTY predictions (never fabricated), unknown airports 404.
          curl -sf "http://127.0.0.1:3000/api/airports/JFK/forecasts" -o /tmp/fc_jfk.json
          grep -q '"airportCode":"JFK"' /tmp/fc_jfk.json
          grep -q '"checkpointId":"ck-jfk-main"' /tmp/fc_jfk.json
          grep -q '"predictions":\[\]' /tmp/fc_jfk.json
          curl -sf "http://127.0.0.1:3000/api/checkpoints/ck-jfk-main/predict" -o /tmp/pred_jfk.json
          grep -q '"checkpointId":"ck-jfk-main"' /tmp/pred_jfk.json
          grep -q '"predictions":\[\]' /tmp/pred_jfk.json
          code=$(curl -s -o /tmp/fc_unknown.json -w '%{http_code}' "http://127.0.0.1:3000/api/airports/QQQ/forecasts")
          if [ "$code" != "404" ]; then
            echo "Expected 404 for unknown airport forecasts, got $code"
            cat /tmp/fc_unknown.json
            exit 1
          fi
          grep -q '"Airport not found"' /tmp/fc_unknown.json
          code=$(curl -s -o /tmp/pred_unk.json -w '%{http_code}' "http://127.0.0.1:3000/api/checkpoints/ck-jfk-north/predict")
          if [ "$code" != "404" ]; then
            echo "Expected 404 for unknown checkpoint predict, got $code"
            cat /tmp/pred_unk.json
            exit 1
          fi
          grep -q '"Checkpoint not found"' /tmp/pred_unk.json
          echo "Mock endpoints OK"

      - name: Verify admin delete contract with a key configured (TIR-299)
        run: |
          ADMIN_API_KEY=ci-admin-key PORT=3788 node server.js &
          SERVER2_PID=$!
          for i in $(seq 1 30); do
            curl -sf http://127.0.0.1:3788/api/health >/dev/null && break
            sleep 1
          done
          # Unauthenticated DELETE -> 401
          code=$(curl -s -o /tmp/del1.json -w '%{http_code}' -X DELETE "http://127.0.0.1:3788/api/reports/rpt_123")
          if [ "$code" != "401" ]; then
            echo "Expected 401 for unauthenticated DELETE, got $code"
            cat /tmp/del1.json
            kill $SERVER2_PID 2>/dev/null || true
            exit 1
          fi
          grep -q 'admin key' /tmp/del1.json
          # Authenticated DELETE of an unknown id -> 404 Report not found
          code=$(curl -s -o /tmp/del2.json -w '%{http_code}' -X DELETE -H "X-Admin-Key: ci-admin-key" "http://127.0.0.1:3788/api/reports/rpt_123")
          if [ "$code" != "404" ]; then
            echo "Expected 404 for authenticated DELETE of unknown id, got $code"
            cat /tmp/del2.json
            kill $SERVER2_PID 2>/dev/null || true
            exit 1
          fi
          grep -q '"Report not found"' /tmp/del2.json
          # Invalid id format -> 400
          code=$(curl -s -o /tmp/del3.json -w '%{http_code}' -X DELETE -H "X-Admin-Key: ci-admin-key" "http://127.0.0.1:3788/api/reports/bad%20id%21")
          if [ "$code" != "400" ]; then
            echo "Expected 400 for invalid report id, got $code"
            cat /tmp/del3.json
            kill $SERVER2_PID 2>/dev/null || true
            exit 1
          fi
          kill $SERVER2_PID 2>/dev/null || true
          echo "Admin delete contract OK"

  moderation-e2e:
    name: Moderation end-to-end (TIR-325)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: flyby
          POSTGRES_PASSWORD: flyby
          POSTGRES_DB: flyby
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U flyby -d flyby"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - working-directory: apps/api
        name: Install dependencies
        run: npm ci --no-audit --no-fund || npm install --no-audit --no-fund

      - working-directory: apps/api
        name: Apply migrations
        env:
          DATABASE_URL: postgresql://flyby:flyby@localhost:5432/flyby?schema=public
        run: npx prisma migrate deploy

      - working-directory: apps/api
        name: Verify flag -> queue -> hide -> clear against a real database
        env:
          DATABASE_URL: postgresql://flyby:flyby@localhost:5432/flyby?schema=public
          ADMIN_API_KEY: ci-admin-key
          PORT: 3790
        run: |
          node server.js &
          for i in $(seq 1 30); do
            curl -sf http://127.0.0.1:3790/api/health >/dev/null && break
            sleep 1
          done

          # 1. Create a report
          ID=$(curl -sf -X POST -H "Content-Type: application/json" \
            -d '{"airport":"JFK","waitMinutes":42,"checkpoint":"Main"}' \
            http://127.0.0.1:3790/api/wait-times | node -p "JSON.parse(require('fs').readFileSync(0)).id")
          echo "created $ID"

          # Report lands in the public list before flagging
          curl -sf "http://127.0.0.1:3790/api/wait-times?airport=JFK" | grep -q '"waitMinutes":42'

          # 2. Flag it -> 201 + moderationStatus flagged
          curl -sf -X POST -H "Content-Type: application/json" -H "X-Admin-Key: ci-admin-key" \
            -d '{"reason":"ci e2e"}' -o /tmp/f1.json "http://127.0.0.1:3790/api/reports/$ID/flag" 2>/dev/null || true
          # Flag is a PUBLIC endpoint: no admin key required
          code=$(curl -s -o /tmp/f1.json -w '%{http_code}' -X POST -H "Content-Type: application/json" \
            -d '{"reason":"ci e2e"}' "http://127.0.0.1:3790/api/reports/$ID/flag")
          if [ "$code" != "201" ]; then echo "flag expected 201, got $code"; cat /tmp/f1.json; exit 1; fi
          grep -q '"moderationStatus":"flagged"' /tmp/f1.json

          # 3. Queue requires the admin key
          code=$(curl -s -o /dev/null -w '%{http_code}' "http://127.0.0.1:3790/api/moderation/reports?status=flagged")
          if [ "$code" != "401" ]; then echo "queue without key expected 401, got $code"; exit 1; fi
          curl -sf -H "X-Admin-Key: ci-admin-key" "http://127.0.0.1:3790/api/moderation/reports?status=flagged" -o /tmp/q1.json
          grep -q "$ID" /tmp/q1.json
          # Redaction: the queue must not leak the reporter field
          if grep -q '"reporter"' /tmp/q1.json; then echo "reporter leaked in queue"; exit 1; fi

          # 4. Flagged-but-unactioned report still counts in public surfaces
          curl -sf "http://127.0.0.1:3790/api/wait-times?airport=JFK" | grep -q '"waitMinutes":42'
          code=$(curl -s -X POST -o /dev/null -w '%{http_code}' "http://127.0.0.1:3790/api/moderation/reports/$ID/hide")
          if [ "$code" != "401" ]; then echo "hide without key expected 401, got $code"; exit 1; fi
          curl -sf -X POST -H "X-Admin-Key: ci-admin-key" "http://127.0.0.1:3790/api/moderation/reports/$ID/hide" -o /tmp/h1.json
          grep -q '"moderationStatus":"hidden"' /tmp/h1.json

          # 5. Hidden report drops out of every public surface (cache invalidated)
          if curl -sf "http://127.0.0.1:3790/api/wait-times?airport=JFK" | grep -q '"waitMinutes":42'; then
            echo "hidden report still visible in public list"; exit 1
          fi
          curl -sf "http://127.0.0.1:3790/api/airports/JFK/wait-stats" -o /tmp/s1.json
          if grep -q '"sampleSize":1' /tmp/s1.json; then echo "hidden report still counted in stats"; exit 1; fi

          # 6. Clear restores it
          curl -sf -X POST -H "X-Admin-Key: ci-admin-key" "http://127.0.0.1:3790/api/moderation/reports/$ID/clear" -o /tmp/c1.json
          grep -q '"moderationStatus":"none"' /tmp/c1.json
          curl -sf "http://127.0.0.1:3790/api/wait-times?airport=JFK" | grep -q '"waitMinutes":42'
          echo "Moderation end-to-end OK"

  docker-build:
    name: Docker build validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build api service image
        run: docker compose --env-file .env.docker build api

  web-test-build:
    name: Web unit tests and production build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm ci --no-audit --no-fund || npm install --no-audit --no-fund

      - name: Run unit tests
        run: npm test

      - name: Production build
        run: npm run build
