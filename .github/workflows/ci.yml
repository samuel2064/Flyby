      # - name: Deploy API to AWS/GCP/Azure
      #   run: |
      #     # aws s3 sync ...
      #     # terraform apply ...
      #     # kubectl apply -f k8s/production/
      #   env:
      #     AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      #     AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      #     DEPLOYMENT_ENV: production
      # - name: Deploy Web to CDN / static hosting
      #   run: |
      #     # Upload web dist to production CDN / static hosting
      #   env:
