name: Web CI

# Frontend (Vite PWA) pipeline. The backend pipeline lives in ci.yml.
# Path-filtered so web changes only run the web job and vice versa.

on:
  push:
    branches: [main]
    paths:
      - "apps/web/**"
      - ".github/workflows/web-ci.yml"
  pull_request:
    branches: [main]
    paths:
      - "apps/web/**"
      - ".github/workflows/web-ci.yml"

jobs:
  web-build:
    name: Web typecheck & build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Build PWA
        env:
          # Render injects the real API base URL for the deployed static site.
          VITE_API_BASE_URL: https://flyby-api.onrender.com
        run: npm run build

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: flyby-web-dist
          path: apps/web/dist
          retention-days: 7
