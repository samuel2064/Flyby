name: Live API smoke check

on:
  push:
    branches: [main]
  # TIR-387: "Live smoke" and "Live web smoke" are REQUIRED status checks on
  # `main` (green-build gate). Without a pull_request trigger these checks
  # never report on PRs and the gate would block every merge. The 15-min
  # scheduled ticks remain the monitor-only path; this makes them a PR-time
  # prod-health canary (do not promote new code while prod is unhealthy).
  pull_request:
    branches: [main]
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:

env:
  BASE_URL: https://flyby-api.onrender.com

jobs:
  live-smoke:
    name: Live smoke
    runs-on: ubuntu-latest
    steps:
      - name: Probe /api/health and product routes (retries tolerate Render cold starts)
        run: |
          set -uo pipefail
          fail() { echo "::error::$1"; exit 1; }

          probe() {
            local path="$1" grep_pattern="$2"
            local attempt=1 code=000
            while [ $attempt -le 3 ]; do
              code=$(curl -s -o /tmp/body.json -w '%{http_code}' --max-time 90 "$BASE_URL$path" || echo 000)
              if [ "$code" = "200" ] && grep -q "$grep_pattern" /tmp/body.json; then
                echo "OK    $path -> 200 (attempt $attempt)"
                return 0
              fi
              echo "RETRY $path -> HTTP $code (attempt $attempt)"
              attempt=$((attempt+1))
              sleep 45
            done
            echo "Response body on final failure:"
            head -c 500 /tmp/body.json || true
            fail "Live smoke check FAILED for $path after 3 attempts (last HTTP $code) - possible Render bad/partial deploy (TIR-301 failure mode)"
          }

          probe "/api/health" '"status":"ok"'
          probe "/api/airports" '"airports"'
          probe "/api/airports/JFK" '"code":"JFK"'
          probe "/api/checkpoints?airport=JFK" '"checkpoints"'
          # TIR-300: forecast routes must exist in the deployed build. A live
          # catch-all 404 {"error":"not_found"} means the build is stale.
          probe "/api/airports/JFK/forecasts" '"airportCode":"JFK"'
          probe "/api/checkpoints/ck-jfk-main/predict" '"checkpointId":"ck-jfk-main"'
          # TIR-313: the 51-airport expansion must be live. A missing ATL in
          # the airport list (or a 404 on its wait-times) means the deployed
          # build still carries the old 5-airport data file.
          probe "/api/airports" '"code":"ATL"'
          probe "/api/checkpoints?airport=ATL" '"Domestic North Checkpoint A"'

          # TIR-309 live guard: subscription endpoints must never leak push
          # credentials or PII. An "endpoint"/"userId" field in a public
          # response means the TIR-294 redaction lapsed again.
          code=$(curl -s -o /tmp/subs.json -w '%{http_code}' --max-time 90 "$BASE_URL/api/subscriptions" || echo 000)
          if [ "$code" != "200" ]; then
            echo "Response body:"
            head -c 500 /tmp/subs.json || true
            fail "GET /api/subscriptions returned HTTP $code (expected 200)"
          fi
          if grep -q '"endpoint"\|"userId"\|"p256dh"\|"auth"' /tmp/subs.json; then
            echo "Response body:"
            head -c 500 /tmp/subs.json || true
            fail "GET /api/subscriptions leaks push credentials / userId publicly - TIR-309 SEC leak"
          fi
          echo "OK    /api/subscriptions -> 200, redacted (TIR-309 contract)"

          # TIR-298 live guard: unknown airports must return app-level 404,
          # never a fabricated wait-time record.
          code=$(curl -s -o /tmp/wt_unknown.json -w '%{http_code}' --max-time 90 "$BASE_URL/api/wait-times?airport=YYY" || echo 000)
          if [ "$code" != "404" ]; then
            echo "Response body:"
            head -c 500 /tmp/wt_unknown.json || true
            fail "Unknown airport wait-times returned HTTP $code (expected 404) - TIR-298 regression"
          fi
          echo "OK    /api/wait-times?airport=YYY -> 404 (TIR-298 contract)"

          # TIR-299 live guard: the admin delete route must exist in prod and
          # the ADMIN_API_KEY is provisioned (render.yaml c142ba7). 401 = key
          # required (correct). Anything else - 404 catch-all (route missing)
          # or 503 (key env lost in a future config regression) - must fail.
          # Tightened 2025: 503 used to be tolerated while the key was pending.
          code=$(curl -s -o /tmp/del_probe.json -w '%{http_code}' --max-time 90 -X DELETE "$BASE_URL/api/reports/rpt_0" || echo 000)
          if [ "$code" != "401" ]; then
            echo "Response body:"
            head -c 500 /tmp/del_probe.json || true
            fail "DELETE /api/reports/rpt_0 without key returned HTTP $code (expected 401) - route/auth regression or ADMIN_API_KEY missing in prod"
          fi
          echo "OK    DELETE /api/reports/rpt_0 -> 401 (route present, admin key provisioned and enforced)"

          # Write-path guard (zero fabrication): a deliberately invalid report
          # must be answered 400 with the {errors:[...]} contract. The write
          # surface (route, CORS, validation) is exercised end to end; nothing
          # is persisted because validation rejects before the store.
          code=$(curl -s -o /tmp/wt_bad.json -w '%{http_code}' --max-time 90 -X POST -H 'Content-Type: application/json' -d '{}' "$BASE_URL/api/wait-times" || echo 000)
          if [ "$code" != "400" ] || ! grep -q '"errors"' /tmp/wt_bad.json; then
            echo "Response body:"
            head -c 500 /tmp/wt_bad.json || true
            fail "POST /api/wait-times with empty body returned HTTP $code (expected 400 with errors[]) - write path contract broken"
          fi
          echo "OK    POST /api/wait-times empty body -> 400 with errors[] (write path guarded)"

          # Aggregation endpoints (TIR-321/322): exist live and stay aggregate-only
          probe "/api/wait-times/summary" '"airportCount"'
          probe "/api/airports/JFK/wait-stats" '"airport":"JFK"'
          code=$(curl -s -o /tmp/stats.json -w '%{http_code}' --max-time 90 "$BASE_URL/api/airports/JFK/wait-stats" || echo 000)
          if grep -q '"userId"\|"p256dh"\|"auth"\|"endpoint"' /tmp/stats.json; then
            echo "Response body:"
            head -c 400 /tmp/stats.json || true
            fail "wait-stats leaks identifying fields - TIR-309 class defect"
          fi
          echo "OK    /api/airports/JFK/wait-stats -> $code (aggregate-only)"

          echo "All live smoke checks passed"

  live-web-smoke:
    name: Live web smoke
    # Pin a Playwright-supported OS. `ubuntu-latest` now resolves to 26.04,
    # where Playwright 1.60.0 cannot install chromium dependencies:
    # "ERROR: Playwright does not support chromium on ubuntu26.04-x64" (TIR-379).
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Probe the deployed PWA (retries tolerate Render cold starts)
        run: |
          set -uo pipefail
          fail() { echo "::error::$1"; exit 1; }

          probe() {
            local path="$1" grep_pattern="$2"
            local attempt=1 code=000
            while [ $attempt -le 3 ]; do
              code=$(curl -sSL --compressed -o /tmp/web.html -w '%{http_code}' --max-time 120 "https://flyby-web.onrender.com$path" || echo 000)
              if [ "$code" = "200" ] && grep -q "$grep_pattern" /tmp/web.html; then
                echo "OK    $path -> 200 (attempt $attempt)"
                return 0
              fi
              echo "RETRY $path -> HTTP $code (attempt $attempt)"
              attempt=$((attempt+1))
              sleep 45
            done
            echo "Response body on final failure:"
            head -c 2000 /tmp/web.html || true
            fail "Live web smoke check FAILED for $path after 3 attempts (last HTTP $code)"
          }

          probe "/" 'id="root"'
          # SPA rewrite: deep links must serve the app shell (200), not a 404
          probe "/airports/JFK" 'id="root"'

          echo "All live web smoke checks passed"

      # TIR-323: browser-level DOM smoke for the deployed PWA. Status-code
      # probes cannot see stale bundles, JS runtime errors, or states that
      # never resolve - the TIR-312 duplicate-cards defect was only ever
      # caught by hand. Playwright now does it on every tick.
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install web deps
        # Same pattern as ci.yml's web job: npm ci wants its lockfile in the
        # working directory; bare `--prefix` breaks on runners without one.
        working-directory: apps/web
        run: npm ci --no-audit --no-fund || npm install --no-audit --no-fund
      - name: Install Playwright chromium
        run: npx playwright install --with-deps chromium
        working-directory: apps/web
      - name: Live DOM smoke
        run: node apps/web/scripts/live-web-smoke.mjs

  # TIR-387 Control 3 (auto-incident): when a *scheduled* live-smoke run
  # fails, file a de-duplicated, labelled incident issue so a bad/partial
  # Render deploy (TIR-301 failure mode) pages a human within one 15-min
  # tick. Scheduled-only: PR runs surface failures as a red check instead.
  file-incident:
    name: File incident on scheduled smoke failure
    needs: [live-smoke, live-web-smoke]
    if: failure() && github.event_name == 'schedule'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const { owner, repo } = context.repo;
            const serverUrl = process.env.GITHUB_SERVER_URL || 'https://github.com';
            const runUrl = `${serverUrl}/${owner}/${repo}/actions/runs/${context.runId}`;

            // Ensure the labels exist (create if missing; ignore races).
            for (const [name, color] of [['auto-incident', 'b60205'], ['ci', 'fbca04']]) {
              try {
                await github.rest.issues.getLabel({ owner, repo, name });
              } catch (e) {
                if (e.status === 404) {
                  await github.rest.issues.createLabel({ owner, repo, name, color });
                }
              }
            }

            // De-dup: skip if an open auto-incident already exists.
            const existing = await github.rest.issues.listForRepo({
              owner, repo, state: 'open', labels: 'auto-incident,ci', per_page: 1,
            });
            if (existing.data.length > 0) {
              core.info(`Open auto-incident already exists (#${existing.data[0].number}); skipping.`);
              return;
            }

            const title = `[auto] Live smoke FAILED on main (${new Date().toISOString().slice(0, 16)}Z)`;
            await github.rest.issues.create({
              owner, repo, title,
              body: [
                'A scheduled live-smoke run failed on **main** - the TIR-301 failure mode (bad or partial Render deploy is live).',
                '',
                `- Run: ${runUrl}`,
                `- Triage: check the Render dashboard for \`flyby-api\` / \`flyby-web\`; rollback = redeploy the last green commit.`,
                '- Filed automatically; de-duplicates against open `auto-incident,ci` issues (TIR-387).',
              ].join('\n'),
              labels: ['auto-incident', 'ci'],
            });
