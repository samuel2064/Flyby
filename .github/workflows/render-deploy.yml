name: Deploy to Render

on:
  workflow_dispatch:
    inputs:
      target:
        description: Services to deploy
        required: true
        default: both
        type: choice
        options:
          - web
          - api
          - both
  workflow_run:
    workflows:
      - CI
    types:
      - completed
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: render-deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy to Render
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
      WEB_HOOK_URL: ${{ secrets.RENDER_WEB_DEPLOY_HOOK_URL }}
      API_HOOK_URL: ${{ secrets.RENDER_API_DEPLOY_HOOK_URL }}
      WEB_SERVICE_ID: ${{ vars.RENDER_WEB_SERVICE_ID }}
      API_SERVICE_ID: ${{ vars.RENDER_API_SERVICE_ID }}
      TARGET: ${{ inputs.target || 'both' }}
    steps:
      - name: Validate configuration
        run: |
          set -euo pipefail
          [[ "$WEB_SERVICE_ID" == "srv-dapocsugekts73ek60t0" ]] || { echo "::error::RENDER_WEB_SERVICE_ID must be the Flyby web service id"; exit 1; }
          [[ "$API_SERVICE_ID" == "srv-dak58lm1egvs73957l50" ]] || { echo "::error::RENDER_API_SERVICE_ID must be the Flyby api service id"; exit 1; }
          if [ -z "$WEB_HOOK_URL" ] && [ -z "$API_HOOK_URL" ] && [ -z "$RENDER_API_KEY" ]; then
            echo "::notice::no Render deploy credential in this repo; the nightlamp ops repo deploys Flyby when main changes (TIR-409)"
          else
            if [ -n "$WEB_HOOK_URL" ]; then echo "web deploy credential: service deploy hook"; elif [ -n "$RENDER_API_KEY" ]; then echo "web deploy credential: workspace API key"; else echo "web deploy credential: none (ops repo deploys)"; fi
            if [ -n "$API_HOOK_URL" ]; then echo "api deploy credential: service deploy hook"; elif [ -n "$RENDER_API_KEY" ]; then echo "api deploy credential: workspace API key"; else echo "api deploy credential: none (ops repo deploys)"; fi
          fi

      - name: Trigger Render deploys
        run: |
          set -euo pipefail
          trigger() {
            local label="$1" hook="$2" sid="$3" code
            if [ -n "$hook" ]; then
              code=$(curl -sS -o "/tmp/deploy-$label.json" -w '%{http_code}' -X POST "$hook")
              echo "$label deploy via service deploy hook -> HTTP $code"
            elif [ -n "$RENDER_API_KEY" ]; then
              code=$(curl -sS -o "/tmp/deploy-$label.json" -w '%{http_code}' -X POST \
                -H "Authorization: Bearer $RENDER_API_KEY" \
                -H 'Content-Type: application/json' \
                -d '{}' \
                "https://api.render.com/v1/services/$sid/deploys")
              echo "$label deploy via workspace API key -> HTTP $code"
            else
              echo "$label: no deploy credential in this repo; the nightlamp ops repo deploys this service when Flyby main changes"
              return 0
            fi
            jq -c '{deploy: .deploy.id, commit: .commit.id, status}' "/tmp/deploy-$label.json" 2>/dev/null || cat "/tmp/deploy-$label.json"
            case "$code" in
              200|201|202) ;;
              *) echo "::error::Render rejected the $label deploy"; exit 1 ;;
            esac
          }
          case "$TARGET" in
            web) trigger web "$WEB_HOOK_URL" "$WEB_SERVICE_ID" ;;
            api) trigger api "$API_HOOK_URL" "$API_SERVICE_ID" ;;
            both) trigger web "$WEB_HOOK_URL" "$WEB_SERVICE_ID"; trigger api "$API_HOOK_URL" "$API_SERVICE_ID" ;;
            *) echo "::error::unknown target $TARGET"; exit 1 ;;
          esac

      - name: Wait for the deploys to go live
        run: |
          set -euo pipefail
          wait_live() {
            local label="$1" sid="$2" status=''
            if [ -z "$RENDER_API_KEY" ]; then
              echo "$label: no workspace API key, relying on the production probes"
              return 0
            fi
            local deadline=$((SECONDS + 900))
            while [ $SECONDS -lt $deadline ]; do
              status=$(curl -sS -H "Authorization: Bearer $RENDER_API_KEY" \
                "https://api.render.com/v1/services/$sid/deploys?limit=1" \
                | jq -r '.[0].deploy.status // "unknown"')
              echo "$label deploy status: $status"
              case "$status" in
                live) return 0 ;;
                failed|deactivated|canceled) echo "::error::$label deploy ended as $status"; return 1 ;;
              esac
              sleep 20
            done
            echo "::error::$label deploy did not go live in time"
            return 1
          }
          case "$TARGET" in
            web) wait_live web "$WEB_SERVICE_ID" ;;
            api) wait_live api "$API_SERVICE_ID" ;;
            both) wait_live web "$WEB_SERVICE_ID"; wait_live api "$API_SERVICE_ID" ;;
          esac

      - name: Verify production
        run: |
          set -euo pipefail
          for url in \
            https://flyby-api.onrender.com/api/health \
            https://flyby-api.onrender.com/api/vapid-public-key \
            https://flyby-web.onrender.com/ \
            https://flyby-web.onrender.com/manifest.webmanifest \
            https://flyby-web.onrender.com/icon-192.png \
            https://flyby-web.onrender.com/icon-512.png \
            https://flyby-web.onrender.com/icon-maskable-512.png \
            https://flyby-web.onrender.com/apple-touch-icon.png
          do
            code=$(curl -sS -o /dev/null -w '%{http_code}' --connect-timeout 30 --max-time 180 --retry 3 --retry-delay 15 --retry-all-errors "$url")
            if [ "$code" != "200" ]; then
              echo "::error::Production check failed for $url with HTTP $code"
              exit 1
            fi
            echo "OK $url"
          done