name: Deploy to Render

on:
  workflow_dispatch:
    inputs:
      target:
        description: Services to deploy
        required: true
        default: both
        type: choice
        options:
          - web
          - api
          - both
  workflow_run:
    workflows:
      - CI
    types:
      - completed
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: render-deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy to Render
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
      WEB_SERVICE_ID: ${{ vars.RENDER_WEB_SERVICE_ID }}
      API_SERVICE_ID: ${{ vars.RENDER_API_SERVICE_ID }}
      TARGET: ${{ inputs.target || 'both' }}
    steps:
      - name: Validate configuration
        run: |
          set -euo pipefail
          test -n "$RENDER_API_KEY" || { echo "::error::RENDER_API_KEY secret is missing"; exit 1; }
          [[ "$WEB_SERVICE_ID" =~ ^srv-[a-z0-9]+$ ]] || { echo "::error::RENDER_WEB_SERVICE_ID is missing or malformed"; exit 1; }
          [[ "$API_SERVICE_ID" =~ ^srv-[a-z0-9]+$ ]] || { echo "::error::RENDER_API_SERVICE_ID is missing or malformed"; exit 1; }
          echo "target=$TARGET web=$WEB_SERVICE_ID api=$API_SERVICE_ID"

      - name: Trigger Render deploys
        run: |
          set -euo pipefail
          trigger() {
            local sid="$1" label="$2" code
            code=$(curl -sS -o "/tmp/deploy-$label.json" -w '%{http_code}' -X POST \
              -H "Authorization: Bearer $RENDER_API_KEY" \
              -H 'Content-Type: application/json' \
              -d '{}' \
              "https://api.render.com/v1/services/$sid/deploys")
            echo "$label deploy -> HTTP $code"
            jq -c '{id, commit: .commit.id, status, createdAt}' "/tmp/deploy-$label.json" 2>/dev/null || cat "/tmp/deploy-$label.json"
            test "$code" = "201" || { echo "::error::Render rejected the $label deploy"; exit 1; }
          }
          case "$TARGET" in
            web) trigger "$WEB_SERVICE_ID" web ;;
            api) trigger "$API_SERVICE_ID" api ;;
            both) trigger "$WEB_SERVICE_ID" web; trigger "$API_SERVICE_ID" api ;;
            *) echo "::error::unknown target $TARGET"; exit 1 ;;
          esac

      - name: Wait for the deploys to go live
        run: |
          set -euo pipefail
          wait_live() {
            local sid="$1" label="$2" status=''
            local deadline=$((SECONDS + 900))
            while [ $SECONDS -lt $deadline ]; do
              status=$(curl -sS -H "Authorization: Bearer $RENDER_API_KEY" \
                "https://api.render.com/v1/services/$sid/deploys?limit=1" \
                | jq -r '.[0].deploy.status // "unknown"')
              echo "$label deploy status: $status"
              case "$status" in
                live) return 0 ;;
                failed|deactivated|canceled) echo "::error::$label deploy ended as $status"; return 1 ;;
              esac
              sleep 20
            done
            echo "::error::$label deploy did not go live in time"
            return 1
          }
          case "$TARGET" in
            web) wait_live "$WEB_SERVICE_ID" web ;;
            api) wait_live "$API_SERVICE_ID" api ;;
            both) wait_live "$WEB_SERVICE_ID" web; wait_live "$API_SERVICE_ID" api ;;
          esac

      - name: Verify production
        run: |
          set -euo pipefail
          for url in \
            https://flyby-api.onrender.com/api/health \
            https://flyby-api.onrender.com/api/vapid-public-key \
            https://flyby-web.onrender.com/ \
            https://flyby-web.onrender.com/manifest.webmanifest \
            https://flyby-web.onrender.com/icon-192.png \
            https://flyby-web.onrender.com/icon-512.png \
            https://flyby-web.onrender.com/icon-maskable-512.png \
            https://flyby-web.onrender.com/apple-touch-icon.png
          do
            code=$(curl -sS -o /dev/null -w '%{http_code}' --connect-timeout 30 --max-time 180 --retry 3 --retry-delay 15 --retry-all-errors "$url")
            if [ "$code" != "200" ]; then
              echo "::error::Production check failed for $url with HTTP $code"
              exit 1
            fi
            echo "OK $url"
          done