name: Render keep-alive

on:
  schedule:
    # GitHub's scheduler drops most cron ticks on this account (2 scheduled
    # runs in the 10 hours after 2026-11-17T02:30Z, with no skipped runs and
    # no minutes overage), so this stays a best-effort second layer only - see
    # TIR-414. A tick every 5 minutes raises the chance that one lands inside
    # Render's 15-minute free-tier sleep window.
    - cron: '*/5 * * * *'
  push:
    # Ping right after a deploy so the API is warm for the first user.
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: render-keep-alive
  cancel-in-progress: true

jobs:
  keep-alive:
    name: Keep Render services warm
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Ping API and web with 503 resilience
        run: |
          set -uo pipefail
          services=(
            "https://flyby-api.onrender.com/api/health"
            "https://flyby-web.onrender.com/"
          )

          for url in "${services[@]}"; do
            consecutive_503=0
            code=""
            attempt=1
            while [ "$attempt" -le 3 ]; do
              code=$(curl -sS -o /dev/null -w '%{http_code}' --connect-timeout 30 --max-time 180 --retry 0 --retry-delay 0 --retry-all-errors "$url" 2>/dev/null || echo "000")
              if [ "$code" = "200" ]; then
                echo "OK    $url (200, attempt $attempt)"
                consecutive_503=0
                break
              fi
              if [ "$code" = "503" ]; then
                consecutive_503=$((consecutive_503 + 1))
                echo "RETRY $url -> 503 (consecutive 503s: $consecutive_503, attempt $attempt)"
                if [ "$consecutive_503" -ge 3 ]; then
                  echo "CIRCUIT BREAKER: 3 consecutive 503s for $url — pausing this service check for 10 minutes"
                  exit 0
                fi
                backoff=$((2 ** attempt))
                sleep $backoff
                attempt=$((attempt + 1))
                continue
              fi
              echo "OTHER $url -> HTTP $code (attempt $attempt)"
              attempt=$((attempt + 1))
              sleep 5
            done
            if [ "$code" = "200" ]; then
              echo "OK    $url"
            fi
          done
